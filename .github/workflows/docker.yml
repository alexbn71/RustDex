name: Tests and Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustdex

jobs:
  test:
    name: Vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build (for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rustdex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name smoke -p 21114:21114 -e RUSTDEX_ADMIN_PASSWORD=smoke-pass rustdex:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:21114/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:21114/ | grep -q '<title>RustDex</title>'
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"smoke-pass"}' \
            http://127.0.0.1:21114/api/login | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:21114/api/ab/shared/profiles | grep -q '"name":"RustDex"'
          docker exec smoke /rustdex healthcheck
          docker rm -f smoke

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
